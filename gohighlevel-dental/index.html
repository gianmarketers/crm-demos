<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoHighLevel Client Demo — Bright Smile Dental</title>
<meta name="description" content="Interactive GoHighLevel sub-account demo for a dental practice: dashboard, pipeline, conversations, calendar, automation, reputation and reporting.">
<style>
  :root{
    --nav:#12172a; --nav-2:#1b2340; --nav-ink:#c7cce0; --nav-ink-2:#8b93b5;
    --nav-active:#3d63f0; --nav-hover:#232c4d;
    --bg:#f4f5f9; --surface:#ffffff; --surface-2:#f7f8fb; --surface-3:#eef0f6;
    --ink:#141726; --ink-2:#5b6178; --muted:#9096ac;
    --line:#e6e8f0; --hairline:rgba(20,23,38,.08);
    --brand:#0891b2; --brand-2:#0e7490; --brand-soft:#d5f2f8;
    --accent:var(--brand-2); --accent-deep:color-mix(in srgb,var(--brand-2) 78%, #000); --accent-soft:var(--brand-soft);
    --good:#12b76a; --good-bg:#e7f8f0; --warn:#f79009; --warn-bg:#fef3e2; --danger:#f04438; --danger-bg:#fde8e6;
    --star:#f5a623;
    --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.07);
    --shadow-lg:0 12px 32px rgba(16,24,40,.14), 0 4px 10px rgba(16,24,40,.08);
    --radius:12px;
  }
  :root[data-theme="dark"]{
    --bg:#0c0f1a; --surface:#141827; --surface-2:#1a1f31; --surface-3:#222840;
    --ink:#eef0f7; --ink-2:#a6adc6; --muted:#79809a;
    --line:#252b40; --hairline:rgba(255,255,255,.08);
    --accent:var(--brand-2); --accent-deep:var(--brand); --accent-soft:var(--brand-soft);
    --good:#3ddc97; --good-bg:#12321f; --warn:#f9b24b; --warn-bg:#3a2a12; --danger:#ff6b60; --danger-bg:#3a1c1a;
    --brand-soft:#0c2a30;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 44px rgba(0,0,0,.55);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion:reduce){ *{animation:none!important; transition:none!important;} }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  h1,h2,h3,h4{line-height:1.2; font-weight:660; letter-spacing:-.01em;}
  svg{display:block;}
  ::-webkit-scrollbar{width:9px; height:9px;} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:99px;}

  .app{display:grid; grid-template-columns:236px 1fr; min-height:100vh;}
  .scrim{position:fixed; inset:0; display:none; background:rgba(8,10,20,.5); z-index:110;}
  /* ---------- Sidebar ---------- */
  .side{background:var(--nav); color:var(--nav-ink); display:flex; flex-direction:column; position:sticky; top:0; height:100vh;}
  .acct{display:flex; align-items:center; gap:11px; padding:16px 16px 14px; border-bottom:1px solid rgba(255,255,255,.07);}
  .acct-logo{width:38px; height:38px; border-radius:10px; flex:none; display:grid; place-items:center; font-weight:800; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand-2)); font-size:16px;}
  .acct-name{font-weight:680; color:#fff; font-size:14.5px; line-height:1.15;}
  .acct-sub{font-size:11.5px; color:var(--nav-ink-2);}
  .acct-switch{margin-left:auto; color:var(--nav-ink-2);}
  .side-scroll{flex:1; overflow-y:auto; padding:10px 10px 4px;}
  .nav-item{display:flex; align-items:center; gap:12px; width:100%; padding:9px 12px; border-radius:9px; color:var(--nav-ink); font-size:13.5px; font-weight:540; margin-bottom:2px; text-align:left; position:relative;}
  .nav-item:hover{background:var(--nav-hover); color:#fff;}
  .nav-item.on{background:var(--accent); color:#fff;}
  .nav-item.on .badge{background:rgba(255,255,255,.22); color:#fff;}
  .nav-item svg{width:18px; height:18px; flex:none; stroke-width:1.9;}
  .nav-item .badge{margin-left:auto; font-size:11px; font-weight:700; background:var(--danger); color:#fff; padding:1px 7px; border-radius:99px;}
  .nav-sec{font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--nav-ink-2); padding:14px 12px 6px;}
  .side-foot{padding:12px; border-top:1px solid rgba(255,255,255,.07); display:flex; align-items:center; gap:10px;}
  .side-foot .ava{width:32px; height:32px; border-radius:50%; background:var(--accent); color:#fff; display:grid; place-items:center; font-weight:700; font-size:12px; flex:none;}
  .side-foot .u b{font-size:12.5px; color:#fff; display:block; line-height:1.2;}
  .side-foot .u span{font-size:11px; color:var(--nav-ink-2);}

  /* ---------- Main ---------- */
  .main{display:flex; flex-direction:column; min-width:0;}
  .topbar{display:flex; align-items:center; gap:14px; padding:13px 24px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;}
  .page-title{font-size:18px; font-weight:680;}
  .page-sub{font-size:12.5px; color:var(--muted);}
  .search-wrap{margin-left:auto; position:relative;}
  .search{display:flex; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:8px 12px; width:240px; color:var(--muted); font-size:13px; transition:border-color .15s, box-shadow .15s;}
  .search:focus-within{border-color:var(--accent); box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent); background:var(--surface);}
  .search svg{width:15px; height:15px; flex:none;}
  .search input{border:none; background:none; outline:none; flex:1; min-width:0; color:var(--ink); font-size:13px; font-family:inherit;}
  .search input::placeholder{color:var(--muted);}
  .search-results{position:absolute; top:calc(100% + 8px); right:0; width:340px; max-height:60vh; overflow-y:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow-lg); z-index:60; padding:6px;}
  .search-results[hidden]{display:none;}
  .sr-head{font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); padding:8px 10px 4px;}
  .sr-item{display:flex; align-items:center; gap:11px; padding:9px 10px; border-radius:9px; cursor:pointer; text-align:left; width:100%; border:none; background:none; font-family:inherit;}
  .sr-item:hover, .sr-item.sel{background:var(--surface-2);}
  .sr-ava{width:32px; height:32px; border-radius:8px; flex:none; display:grid; place-items:center; font-weight:700; font-size:12px; color:#fff; background:linear-gradient(135deg,var(--brand),var(--brand-2));}
  .sr-main{flex:1; min-width:0;}
  .sr-name{font-size:13.5px; font-weight:620; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sr-sub{font-size:11.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .sr-type{font-size:10px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); padding:3px 8px; border-radius:99px; flex:none;}
  .sr-empty{padding:20px 12px; text-align:center; color:var(--muted); font-size:13px;}
  .kbd{font-size:10.5px; font-weight:700; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 5px; min-width:17px; text-align:center; line-height:1.5;}
  .search .kbd{flex:none;} .search:focus-within .kbd{opacity:0;}
  /* keyboard-shortcuts overlay */
  .sc-scrim{position:fixed; inset:0; background:rgba(10,12,20,.5); z-index:200; display:none; align-items:center; justify-content:center; padding:20px;}
  .sc-scrim.on{display:flex; animation:fade .18s ease;}
  .sc-modal{background:var(--surface); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow-lg); width:100%; max-width:440px; overflow:hidden;}
  .sc-h{padding:15px 20px; border-bottom:1px solid var(--line); font-weight:720; font-size:15px; display:flex; align-items:center; gap:9px;}
  .sc-h svg{width:18px; height:18px; stroke:var(--accent);}
  .sc-body{padding:6px 20px 16px; max-height:64vh; overflow-y:auto;}
  .sc-row{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13px; color:var(--ink-2);}
  .sc-row:last-child{border-bottom:none;}
  .sc-keys{display:flex; align-items:center; gap:5px; flex:none;}
  .sc-keys .then{color:var(--muted); font-size:11px;}
  .tb-btn{width:38px; height:38px; border-radius:9px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; position:relative;}
  .tb-btn:hover{background:var(--surface-2);}
  .tb-btn svg{width:17px; height:17px; stroke:var(--ink-2);}
  .tb-btn .dot{position:absolute; top:8px; right:9px; width:7px; height:7px; border-radius:50%; background:var(--danger); border:2px solid var(--surface);}
  .demochip{font-size:11px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--accent); background:var(--accent-soft); border:1px solid color-mix(in srgb,var(--accent) 30%,transparent); padding:3px 9px; border-radius:99px;}

  .content{padding:24px; overflow-x:hidden;}
  .view{display:none; animation:fade .25s ease;} .view.on{display:block;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .card{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); box-shadow:var(--shadow);}
  .card-pad{padding:18px;}
  .card-h{display:flex; align-items:center; gap:10px; padding:15px 18px; border-bottom:1px solid var(--line);}
  .card-h h3{font-size:14.5px;} .card-h .sub{font-size:12px; color:var(--muted);}
  .card-h .link{margin-left:auto; font-size:12.5px; font-weight:600; color:var(--accent);}
  .btn{display:inline-flex; align-items:center; gap:7px; padding:8px 14px; border-radius:8px; font-weight:600; font-size:13px; border:1px solid transparent;}
  .btn-primary{background:var(--accent); color:#fff;} .btn-primary:hover{background:var(--accent-deep);}
  .btn-ghost{border-color:var(--line); background:var(--surface); color:var(--ink);} .btn-ghost:hover{background:var(--surface-2);}
  .btn svg{width:15px; height:15px;}

  /* KPI tiles */
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:16px;}
  @media(max-width:1000px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  .kpi{padding:16px 18px;} .kpi .kt{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
  .kpi .ki{width:34px; height:34px; border-radius:9px; display:grid; place-items:center;}
  .kpi .ki svg{width:17px; height:17px;}
  .kpi .kl{font-size:12.5px; color:var(--ink-2); font-weight:560;}
  .kpi .kv{font-size:26px; font-weight:720; letter-spacing:-.02em;}
  .kpi .kd{font-size:12px; font-weight:640; margin-top:3px; display:inline-flex; gap:4px; align-items:center;}
  .kd.up{color:var(--good);} .kd.down{color:var(--danger);}
  .ib{background:var(--accent-soft); color:var(--accent);} .ig{background:var(--good-bg); color:var(--good);}
  .iw{background:var(--warn-bg); color:var(--warn);} .ip{background:var(--brand-soft); color:var(--brand-2);}

  .grid2{display:grid; grid-template-columns:1.5fr 1fr; gap:16px;} @media(max-width:980px){ .grid2{grid-template-columns:1fr;} }
  .grid2b{display:grid; grid-template-columns:1fr 1fr; gap:16px;} @media(max-width:980px){ .grid2b{grid-template-columns:1fr;} }

  /* bar chart */
  .bars{display:flex; align-items:flex-end; gap:12px; height:180px; padding:8px 4px 0;}
  .bar-col{flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; justify-content:flex-end;}
  .bar{width:60%; max-width:34px; border-radius:6px 6px 0 0; background:var(--accent); transition:height .8s cubic-bezier(.4,0,.2,1); position:relative;}
  .bar.alt{background:var(--brand);} .bar-lbl{font-size:11px; color:var(--muted);} .bar-val{font-size:11px; font-weight:700; color:var(--ink-2);}
  .legend{display:flex; gap:16px; font-size:12px; color:var(--ink-2); padding:0 4px 4px;}
  .legend i{width:10px; height:10px; border-radius:3px; display:inline-block; margin-right:6px; vertical-align:middle;}

  /* activity feed */
  .feed{display:grid;} .feed-row{display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); width:100%; text-align:left; background:none; border-left:none; border-right:none; border-top:none; color:inherit; font-family:inherit;}
  .feed-row:last-child{border-bottom:none;}
  .feed-row[data-fgo]{cursor:pointer; border-radius:8px; margin:0 -8px; padding-left:8px; padding-right:8px; transition:background .1s;}
  .feed-row[data-fgo]:hover{background:var(--surface-2);} .feed-row[data-fgo]:focus-visible{outline:2px solid var(--accent); outline-offset:-2px;}
  .feed-ic{width:30px; height:30px; border-radius:8px; flex:none; display:grid; place-items:center;} .feed-ic svg{width:15px; height:15px;}
  .feed b{font-weight:640;} .feed .ft{font-size:13px; color:var(--ink-2);} .feed .fm{font-size:11.5px; color:var(--muted); margin-top:1px;}

  /* pipeline kanban */
  .pipe{display:grid; grid-auto-flow:column; grid-auto-columns:264px; gap:14px; overflow-x:auto; padding-bottom:8px;}
  .col{background:var(--surface-2); border:1px solid var(--line); border-radius:12px; display:flex; flex-direction:column; max-height:640px;}
  .col-h{display:flex; align-items:center; gap:8px; padding:12px 14px; border-bottom:1px solid var(--line);}
  .col-h .cn{font-size:13px; font-weight:680;} .col-h .cc{font-size:11px; font-weight:700; color:var(--muted); background:var(--surface-3); padding:1px 8px; border-radius:99px;}
  .col-h .cv{margin-left:auto; font-size:12px; font-weight:700; color:var(--good);}
  .col-body{padding:10px; display:grid; gap:9px; overflow-y:auto;}
  .op{background:var(--surface); border:1px solid var(--hairline); border-radius:10px; padding:11px 12px; box-shadow:var(--shadow); cursor:grab;}
  .op:hover{border-color:var(--accent);}
  .op .on{font-weight:640; font-size:13px;} .op .os{font-size:12px; color:var(--ink-2); margin:2px 0 8px;}
  .op-foot{display:flex; align-items:center; gap:8px;}
  .op-val{font-size:12.5px; font-weight:720; color:var(--ink);}
  .op-ava{width:22px; height:22px; border-radius:50%; margin-left:auto; display:grid; place-items:center; font-size:10px; font-weight:700; color:#fff;}
  .tag{font-size:10.5px; font-weight:640; padding:2px 7px; border-radius:6px;}
  .col-band{height:3px; border-radius:99px 99px 0 0;}

  /* conversations */
  .conv{display:grid; grid-template-columns:300px 1fr; height:600px; border:1px solid var(--line); border-radius:12px; overflow:hidden; background:var(--surface);}
  @media(max-width:820px){ .conv{grid-template-columns:1fr; height:auto;} .conv .thread{display:none;} }
  .conv-list{border-right:1px solid var(--line); overflow-y:auto;}
  .conv-item{display:flex; gap:11px; padding:13px 14px; border-bottom:1px solid var(--line); cursor:pointer; position:relative;}
  .conv-item:hover{background:var(--surface-2);} .conv-item.on{background:var(--accent-soft);}
  .conv-item.on::before{content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--accent);}
  .conv-ava{width:38px; height:38px; border-radius:50%; flex:none; display:grid; place-items:center; font-weight:700; color:#fff; font-size:13px;}
  .conv-meta{min-width:0; flex:1;} .conv-meta .cn{font-weight:640; font-size:13px; display:flex; align-items:center; gap:6px;}
  .conv-meta .cp{font-size:12px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .conv-time{font-size:11px; color:var(--muted); flex:none;}
  .ch-ic{width:15px; height:15px;} .un{width:8px; height:8px; border-radius:50%; background:var(--accent); flex:none;}
  .thread{display:flex; flex-direction:column;}
  .thread-h{display:flex; align-items:center; gap:11px; padding:14px 18px; border-bottom:1px solid var(--line);}
  .thread-body{flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; background:var(--surface-2);}
  .msg{max-width:74%; padding:10px 13px; border-radius:13px; font-size:13px; line-height:1.45;}
  .msg .mt{font-size:10.5px; color:var(--muted); margin-top:5px;}
  .msg.in{align-self:flex-start; background:var(--surface); border:1px solid var(--line); border-bottom-left-radius:4px;}
  .msg.out{align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px;} .msg.out .mt{color:rgba(255,255,255,.75);}
  .msg.note{align-self:center; background:var(--warn-bg); color:var(--ink-2); font-size:11.5px; border-radius:8px; max-width:90%;}
  .thread-input{display:flex; align-items:center; gap:10px; padding:12px 16px; border-top:1px solid var(--line);}
  .thread-input .fake{flex:1; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:10px 12px; color:var(--muted); font-size:13px;}
  .chan-tabs{display:flex; gap:6px;} .chan-tab{font-size:11px; font-weight:600; padding:3px 9px; border-radius:7px; background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);}
  .chan-tab.on{background:var(--accent); color:#fff; border-color:transparent;}

  /* calendar */
  .cal{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal .dow{font-size:11px; font-weight:700; color:var(--muted); text-align:center; padding:4px 0; text-transform:uppercase; letter-spacing:.04em;}
  .cal .day{min-height:74px; border:1px solid var(--line); border-radius:9px; padding:6px; background:var(--surface); font-size:11px;}
  .cal .day.out{background:var(--surface-2); color:var(--muted);}
  .cal .dn{font-weight:640; color:var(--ink-2); margin-bottom:4px;} .cal .day.today .dn{color:#fff; background:var(--accent); width:20px; height:20px; border-radius:50%; display:grid; place-items:center;}
  .appt{font-size:10px; font-weight:600; padding:2px 5px; border-radius:5px; margin-bottom:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .appt.botox{background:rgba(79,86,199,.15); color:#5b6bd6;} .appt.facial{background:var(--brand-soft); color:var(--brand-2);} .appt.laser{background:var(--good-bg); color:var(--good);} .appt.consult{background:var(--warn-bg); color:var(--warn);}
  .appt[data-appt]{cursor:pointer;} .appt[data-appt]:hover{box-shadow:inset 0 0 0 1.5px currentColor;} .appt[data-appt]:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
  /* month/week segmented toggle + week agenda */
  .cal-seg-wrap{display:flex; gap:2px; background:var(--surface-2); border:1px solid var(--line); border-radius:8px; padding:2px; margin-left:auto;}
  .cal-seg{font-size:12px; font-weight:600; padding:5px 12px; border-radius:6px; border:none; background:none; color:var(--muted); cursor:pointer; font-family:inherit;}
  .cal-seg.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .calweek-wrap{overflow-x:auto;}
  .calweek{display:grid; grid-template-columns:repeat(7,1fr); gap:8px; min-width:660px;}
  .cw-col{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 7px; min-height:230px;}
  .cw-col.today{border-color:var(--accent); background:var(--accent-soft);}
  .cw-dow{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); text-align:center;}
  .cw-dn{font-size:16px; font-weight:750; text-align:center; margin:2px 0 8px; color:var(--ink-2);}
  .cw-col.today .cw-dn{color:var(--accent);}
  .cw-col .appt{white-space:normal; padding:5px 7px; font-size:10.5px; margin-bottom:5px; line-height:1.3;}
  .cw-empty{font-size:11px; color:var(--muted); text-align:center; margin-top:14px;}
  .up-appt{display:flex; align-items:center; gap:12px; padding:11px 0; border-bottom:1px solid var(--line);} .up-appt:last-child{border:none;}
  .up-time{text-align:center; flex:none; width:58px;} .up-time b{font-size:14px; display:block;} .up-time span{font-size:10.5px; color:var(--muted);}
  .up-bar{width:3px; align-self:stretch; border-radius:99px;}

  /* workflow builder */
  .wf-tabs{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .wf-tab{padding:8px 14px; border-radius:9px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--surface); color:var(--ink-2);}
  .wf-tab.on{background:var(--accent); color:#fff; border-color:transparent;}
  .wf-tab .st{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:6px; background:var(--good);}
  .flow{max-width:420px; margin:0 auto; display:flex; flex-direction:column; align-items:center; padding:6px 0;}
  .node{width:100%; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px 15px; display:flex; gap:12px; align-items:center; box-shadow:var(--shadow);}

    const below=r.bottom+180<window.innerHeight;
    tcard.style.top=below?Math.min(r.bottom+14,window.innerHeight-210)+"px":Math.max(r.top-200,12)+"px";
    tcard.style.left=Math.max(12,Math.min(r.left,window.innerWidth-360))+"px";
    $("#tn").addEventListener("click",()=>{ti++;showTour();}); $("#tp").addEventListener("click",()=>{ti--;showTour();}); $("#tx").addEventListener("click",endTour);
  }));
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ endTour(); closeDrawer(); toggleNotif(false); hideSearch(); if(scModal&&scModal.classList.contains("on")) toggleSC(false); } });

/* boot */
renderNav(); go("dashboard");
</script>
</body>
</html>
