<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HubSpot Portal Audit — Interactive Sample</title>
<script>
  (function(){
    var t = null;
    try { t = localStorage.getItem('as-theme'); } catch(e){}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root{
    --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ef;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --line:#e1e0d9; --hairline:rgba(11,11,11,.10);
    --accent:#2a78d6; --accent-soft:#cde2fb; --accent-deep:#1c5cab; --on-accent:#ffffff;
    --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --good-bg:rgba(12,163,12,.10); --warn-bg:rgba(250,178,25,.14); --serious-bg:rgba(236,131,90,.13); --crit-bg:rgba(208,59,59,.10);
    --crit-text:#b32e2e;
    --shadow:0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.06);
    --shadow-lg:0 4px 12px rgba(11,11,11,.10), 0 16px 48px rgba(11,11,11,.14);
    --radius:12px;
  }
  :root[data-theme="dark"]{
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --hairline:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:#184f95; --accent-deep:#86b6ef; --on-accent:#ffffff;
    --good:#0ca30c; --good-text:#0ca30c; --crit-text:#e66767;
    --good-bg:rgba(12,163,12,.16); --warn-bg:rgba(250,178,25,.16); --serious-bg:rgba(236,131,90,.16); --crit-bg:rgba(208,59,59,.18);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 4px 12px rgba(0,0,0,.5), 0 16px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--bg); color:var(--ink); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  h1,h2,h3,h4{line-height:1.25; font-weight:650;}
  .wrap{max-width:1060px; margin:0 auto; padding:0 20px;}

  .topbar{
    position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(10px); border-bottom:1px solid var(--line);
  }
  .topbar-inner{display:flex; align-items:center; gap:12px; padding:12px 0;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px;}
  .brand-mark{
    width:30px; height:30px; border-radius:8px; flex:none;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    display:grid; place-items:center; color:#fff;
  }
  .brand-mark svg{width:16px; height:16px;}
  .demo-chip{
    font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    padding:2px 8px; border-radius:99px;
  }
  .topbar-actions{margin-left:auto; display:flex; gap:8px;}
  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    padding:9px 16px; border-radius:9px; font-weight:600; font-size:14px;
    border:1px solid transparent; transition:background .15s, border-color .15s, transform .06s;
    text-decoration:none;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:var(--on-accent);}
  .btn-primary:hover{background:var(--accent-deep); color:var(--on-accent);}
  :root[data-theme="dark"] .btn-primary:hover{background:#5598e7;}
  .btn-ghost{border-color:var(--hairline); background:var(--surface); color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-lg{padding:12px 24px; font-size:15px; border-radius:11px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed; pointer-events:none;}
  .icon-btn{width:38px; height:38px; padding:0; border-radius:9px; border:1px solid var(--hairline); background:var(--surface); display:grid; place-items:center;}
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn svg{width:17px; height:17px; stroke:var(--ink-2);}

  .stepper{display:flex; gap:4px; padding:14px 0 0; overflow-x:auto; scrollbar-width:none;}
  .stepper::-webkit-scrollbar{display:none;}
  .step{
    display:flex; align-items:center; gap:8px; flex:1; min-width:max-content;
    padding:8px 12px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted);
    border:1px solid transparent; white-space:nowrap;
  }
  .step:not([disabled]):hover{background:var(--surface-2);}
  .step .dot{
    width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-size:11px; font-weight:700; background:var(--surface-2); color:var(--muted);
    border:1px solid var(--line);
  }
  .step.done .dot{background:var(--good-bg); color:var(--good-text); border-color:transparent;}
  .step.done{color:var(--ink-2);}
  .step.active{color:var(--ink); background:var(--surface); border-color:var(--hairline); box-shadow:var(--shadow);}
  .step.active .dot{background:var(--accent); color:var(--on-accent); border-color:transparent;}
  .step[disabled]{cursor:not-allowed; opacity:.55;}

  main{padding:28px 0 60px;}
  .screen{display:none; animation:fadein .25s ease;}
  .screen.on{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}
  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
  .screen-title{font-size:26px; margin-bottom:6px;}
  .screen-sub{color:var(--ink-2); max-width:660px; margin-bottom:26px;}
  .card{background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius); padding:20px;}
  .next-row{display:flex; justify-content:flex-end; gap:10px; margin-top:24px; flex-wrap:wrap;}
  .next-row .left{margin-right:auto;}

  /* ---------- Screen 0: Portal picker ---------- */
  .hero{padding:36px 0 10px; text-align:center;}
  .hero h1{font-size:clamp(28px, 4.5vw, 40px); letter-spacing:-.01em; max-width:700px; margin:0 auto 14px;}
  .hero p{color:var(--ink-2); max-width:620px; margin:0 auto 10px; font-size:16px;}
  .hero .fineprint{font-size:13px; color:var(--muted);}
  .pick-label{font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:28px 0 12px;}
  .portal-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px;}
  .portal-btn{
    text-align:left; background:var(--surface); border:1px solid var(--hairline);
    border-radius:var(--radius); padding:18px; display:block; width:100%;
    transition:border-color .15s, box-shadow .15s, transform .1s;
  }
  .portal-btn:hover{box-shadow:var(--shadow-lg); transform:translateY(-2px);}
  .portal-btn.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .pb-top{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
  .portal-logo{
    width:44px; height:44px; border-radius:11px; flex:none;
    color:#fff; display:grid; place-items:center; font-weight:800; font-size:18px;
  }
  .pb-top b{font-size:15.5px; display:block;}
  .pb-tag{font-size:12px; color:var(--accent); font-weight:650;}
  .pb-desc{font-size:12.5px; color:var(--ink-2); margin-bottom:12px; min-height:38px;}
  .pb-stats{display:flex; gap:14px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:11px;}
  .pb-stat b{font-size:14px; display:block;}
  .pb-stat span{font-size:11px; color:var(--muted);}
  .pb-cta{margin-top:12px; font-size:12.5px; font-weight:650; color:var(--accent); display:flex; align-items:center; gap:5px;}
  .portal-detail{margin-top:14px;}
  .portal-detail .pd-head{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .pd-head h3{font-size:16px;}
  .pd-head p{font-size:13px; color:var(--ink-2);}
  .portal-stats{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(115px, 1fr)); gap:10px;
    margin-top:14px; padding-top:14px; border-top:1px solid var(--line);
  }
  .pstat .v{font-size:19px; font-weight:650;}
  .pstat .l{font-size:12px; color:var(--muted);}
  .cover-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:10px;}
  .cover-item{display:flex; gap:11px; align-items:flex-start; padding:13px 15px;}
  .cover-ic{
    width:32px; height:32px; border-radius:9px; flex:none; display:grid; place-items:center;
    background:color-mix(in srgb, var(--accent) 11%, transparent); font-size:15px;
  }
  .cover-item b{font-size:13.5px; display:block;}
  .cover-item span{font-size:12px; color:var(--muted);}
  .start-row{text-align:center; margin-top:30px;}
  .start-hint{font-size:13px; color:var(--muted); margin-top:10px;}

  /* ---------- Screen 1: Scan ---------- */
  .scan-panel{max-width:560px; margin:0 auto; text-align:center; padding:34px 24px;}
  .scan-panel p{color:var(--ink-2); margin-bottom:22px;}
  .scan-list{list-style:none; text-align:left; display:grid; gap:10px; max-width:400px; margin:0 auto 8px;}
  .scan-list li{display:flex; align-items:center; gap:10px; font-size:13.5px; color:var(--ink-2); opacity:.35; transition:opacity .3s;}
  .scan-list li.on{opacity:1;}
  .scan-list li .st{margin-left:auto; font-size:12px; font-weight:650; color:var(--muted);}
  .scan-list li.on .st{color:var(--good-text);}
  .spinner{
    width:14px; height:14px; border-radius:50%; flex:none;
    border:2px solid var(--line); border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Screen 2: Findings ---------- */
  .score-hero{display:flex; gap:26px; align-items:center; flex-wrap:wrap; margin-bottom:14px;}
  .ring-wrap{position:relative; width:132px; height:132px; flex:none;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-num{position:absolute; inset:0; display:grid; place-items:center; text-align:center;}
  .ring-num .n{font-size:36px; font-weight:650; line-height:1;}
  .ring-num .of{font-size:11.5px; color:var(--muted);}
  .score-sum{flex:1; min-width:250px;}
  .score-sum h3{font-size:19px; margin-bottom:4px;}
  .score-sum p{font-size:13.5px; color:var(--ink-2); max-width:480px;}
  .hero-stats{display:grid; gap:10px; min-width:190px;}
  .hstat{padding:10px 14px; border:1px solid var(--line); border-radius:10px; background:var(--surface-2);}
  .hstat .v{font-size:19px; font-weight:650;}
  .hstat .l{font-size:11.5px; color:var(--muted);}
  .hero-foot{font-size:11.5px; color:var(--muted); margin-bottom:16px;}
  .find-toolbar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px;}
  .sev-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:650;
    padding:6px 12px; border-radius:99px; border:1px solid var(--hairline); background:var(--surface);
    color:var(--ink-2);
  }
  .sev-chip:hover{background:var(--surface-2);}
  .sev-chip.on{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); color:var(--ink);}
  .sev-dot{width:9px; height:9px; border-radius:50%; flex:none;}
  .sd-crit{background:var(--crit);} .sd-serious{background:var(--serious);}
  .sd-warn{background:var(--warn);} .sd-pass{background:var(--good);}
  .expand-btn{margin-left:auto; font-size:12.5px; font-weight:650; color:var(--accent);}
  .expand-btn:hover{text-decoration:underline;}
  .cat-chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .cat-chip{
    font-size:12px; font-weight:600; padding:5px 11px; border-radius:99px;
    background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
  }
  .cat-chip:hover{background:var(--surface); border-color:var(--hairline); color:var(--ink);}
  .cat-grid{display:grid; gap:14px;}
  .cat-card{padding:0; overflow:hidden; scroll-margin-top:130px;}
  .cat-head{display:flex; align-items:center; gap:13px; padding:16px 20px;}
  .cat-ic{
    width:36px; height:36px; border-radius:10px; flex:none; display:grid; place-items:center;
    background:color-mix(in srgb, var(--accent) 11%, transparent); font-size:16px;
  }
  .cat-name{font-weight:650; font-size:15px;}
  .cat-count{font-size:12px; color:var(--muted);}
  .cat-score{margin-left:auto; text-align:right; min-width:150px;}
  .cat-score .cs-row{display:flex; align-items:center; justify-content:flex-end; gap:8px;}
  .cs-num{font-size:17px; font-weight:650; font-variant-numeric:tabular-nums;}
  .band{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700;
    padding:2px 8px; border-radius:99px;
  }
  .band.good{background:var(--good-bg); color:var(--good-text);}
  .band.warn{background:var(--warn-bg); color:var(--ink);}
  .band.serious{background:var(--serious-bg); color:var(--ink);}
  .band.crit{background:var(--crit-bg); color:var(--crit-text);}
  .meter{height:6px; border-radius:99px; margin-top:7px; overflow:hidden;}
  .meter .mfill{height:100%; border-radius:99px;}
  .m-good{background:color-mix(in srgb, var(--good) 22%, var(--surface-2));}
  .m-warn{background:color-mix(in srgb, var(--warn) 22%, var(--surface-2));}
  .m-serious{background:color-mix(in srgb, var(--serious) 22%, var(--surface-2));}
  .m-crit{background:color-mix(in srgb, var(--crit) 22%, var(--surface-2));}
  .mfill.good{background:var(--good);} .mfill.warn{background:var(--warn);}
  .mfill.serious{background:var(--serious);} .mfill.crit{background:var(--crit);}
  .find-list{border-top:1px solid var(--line);}
  .find-row{border-bottom:1px solid var(--line);}
  .find-row:last-child{border-bottom:none;}
  .find-btn{
    width:100%; display:flex; align-items:center; gap:11px; text-align:left;
    padding:12px 20px; font-size:13.5px;
  }
  .find-btn:hover{background:var(--surface-2);}
  .sev-tag{
    display:inline-flex; align-items:center; gap:5px; flex:none; width:86px;
    font-size:11px; font-weight:700; padding:3px 0 3px 9px; border-radius:99px;
  }
  .sev-tag.crit{background:var(--crit-bg); color:var(--crit-text);}
  .sev-tag.serious{background:var(--serious-bg); color:var(--ink);}
  .sev-tag.warn{background:var(--warn-bg); color:var(--ink);}
  .sev-tag.pass{background:var(--good-bg); color:var(--good-text);}
  .find-title{font-weight:600; flex:1;}
  .find-stat{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; white-space:nowrap;}
  .chev{color:var(--muted); flex:none; transition:transform .2s;}
  .find-row.open .chev{transform:rotate(90deg);}
  .find-detail{display:none; padding:2px 20px 16px 117px; font-size:13px; color:var(--ink-2);}
  .find-row.open .find-detail{display:block;}
  .find-detail .fd-block{margin-top:8px;}
  .find-detail b{color:var(--ink); font-weight:650; font-size:12px; letter-spacing:.04em; text-transform:uppercase; display:block; margin-bottom:2px;}
  .spark{display:inline-block; vertical-align:middle; margin-left:6px;}
  @media(max-width:700px){ .find-detail{padding-left:20px;} .cat-score{min-width:120px;} .hero-stats{width:100%; grid-template-columns:repeat(3,1fr);} }

  /* ---------- Screen 3: Fix plan ---------- */
  .plan-cols{display:grid; grid-template-columns:1.15fr 1fr; gap:14px; margin-bottom:18px;}
  @media(max-width:860px){.plan-cols{grid-template-columns:1fr;}}
  .fix-list{list-style:none;}
  .fix-item{
    display:flex; gap:12px; align-items:flex-start; padding:11px 0;
    border-bottom:1px solid var(--line); font-size:13.5px;
  }
  .fix-item:last-child{border-bottom:none;}
  .fix-n{
    width:24px; height:24px; border-radius:50%; flex:none; display:grid; place-items:center;
    background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:700;
  }
  .fix-body{flex:1;}
  .fix-body b{font-weight:650;}
  .fix-body span{display:block; font-size:12.5px; color:var(--muted);}
  .fix-tags{display:flex; gap:6px; flex:none; flex-wrap:wrap; justify-content:flex-end;}
  .tag{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:99px;
    background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line); white-space:nowrap;
  }
  .tag.hi{background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent); border-color:transparent;}
  .quad-card h3, .tl-card h3, .plan-card h3{font-size:15px; margin-bottom:2px;}
  .quad-card .sub, .tl-card .sub, .plan-card .sub{font-size:12.5px; color:var(--muted); margin-bottom:14px;}
  .quad{
    position:relative; height:300px; border-radius:9px;
    background:
      linear-gradient(var(--line), var(--line)) 50% 0/1px 100% no-repeat,
      linear-gradient(var(--line), var(--line)) 0 50%/100% 1px no-repeat,
      var(--surface-2);
    margin-bottom:8px;
  }
  .quad-lab{
    position:absolute; font-size:10.5px; font-weight:700; letter-spacing:.05em;
    text-transform:uppercase; color:var(--muted); padding:6px 9px;
  }
  .quad-dot{
    position:absolute; width:26px; height:26px; border-radius:50%;
    background:var(--accent); color:var(--on-accent); font-size:12px; font-weight:700;
    display:grid; place-items:center; transform:translate(-50%,-50%);
    border:2px solid var(--surface); cursor:default;
  }
  .quad-dot:hover{background:var(--accent-deep);}
  .quad-axis{display:flex; justify-content:space-between; font-size:11.5px; color:var(--muted);}
  .quad-tip{
    position:absolute; pointer-events:none; z-index:5; display:none;
    background:var(--ink); color:var(--bg); font-size:12px; font-weight:600;
    padding:6px 10px; border-radius:7px; white-space:nowrap; box-shadow:var(--shadow-lg);
  }
  .tl-grid{display:grid; gap:10px;}
  .tl-row{display:grid; grid-template-columns:74px 1fr; gap:12px; align-items:start;}
  .tl-week{
    font-size:11.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    color:var(--accent); padding-top:2px;
  }
  .tl-body{font-size:13px; color:var(--ink-2); border-left:2px solid var(--line); padding-left:12px;}
  .tl-body b{color:var(--ink); font-weight:600;}

  /* ---------- Screen 4: Your audit ---------- */
  .get-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(230px, 1fr)); gap:14px; margin-bottom:18px;}
  .get-card b{display:block; font-size:14px; margin-bottom:4px;}
  .get-card p{font-size:13px; color:var(--ink-2);}
  .get-ic{
    width:34px; height:34px; border-radius:9px; display:grid; place-items:center;
    background:color-mix(in srgb, var(--accent) 11%, transparent); font-size:15px; margin-bottom:10px;
  }
  .process{margin-bottom:18px;}
  .process h3, .price-sec h3, .faq-sec h3{font-size:15px; margin-bottom:12px;}
  .proc-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px;}
  .proc-step .d{font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--accent);}
  .proc-step b{font-size:13.5px; display:block; margin:2px 0;}
  .proc-step p{font-size:12.5px; color:var(--muted);}
  .price-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-bottom:8px;}
  .price-card{position:relative; display:flex; flex-direction:column;}
  .price-card.popular{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .pop-chip{
    position:absolute; top:-10px; left:18px; font-size:10.5px; font-weight:700;
    letter-spacing:.04em; text-transform:uppercase; background:var(--accent); color:var(--on-accent);
    padding:2px 10px; border-radius:99px;
  }
  .price-card .pc-name{font-weight:700; font-size:14.5px;}
  .price-card .pc-size{font-size:12px; color:var(--muted); margin-bottom:10px;}
  .price-card .pc-price{font-size:26px; font-weight:650; margin-bottom:2px;}
  .price-card .pc-per{font-size:11.5px; color:var(--muted); margin-bottom:12px;}
  .price-card ul{list-style:none; display:grid; gap:6px; font-size:12.5px; color:var(--ink-2);}
  .price-card ul li{display:flex; gap:7px; align-items:baseline;}

/* ---------------- State & helpers ---------------- */
const state = { portalId:null, step:0, unlocked:0, filter:"all", scanned:false, open:{} };
const $  = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => Array.from((r||document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P = () => PORTALS.find(p=>p.id===state.portalId) || PORTALS[0];

const STEP_NAMES = ["Portal","Scan","Findings","Fix plan","Your audit"];
const SEV_LABEL = {crit:"Critical", serious:"Serious", warn:"Warning", pass:"Passed"};
const SEV_ICON  = {crit:"✖", serious:"!", warn:"▲", pass:"✓"};
function band(score){ return score>=75?"good":score>=60?"warn":score>=45?"serious":"crit"; }
const BAND_LABEL = {good:"Healthy", warn:"Needs attention", serious:"At risk", crit:"Critical"};
function overall(p){ return Math.round(p.cats.reduce((a,c)=>a+c.score,0)/p.cats.length); }
function counts(p){
  const n = {crit:0, serious:0, warn:0, pass:0};
  p.cats.forEach(c=>c.findings.forEach(f=>n[f.sev]++));
  return n;
}
function resetAudit(){
  state.step=0; state.unlocked=0; state.filter="all"; state.scanned=false; state.open={};
}

/* ---------------- Stepper ---------------- */
function renderStepper(){
  $("#stepper").innerHTML = STEP_NAMES.map((n,i)=>{
    const cls = ["step", i===state.step?"active":"", i<state.step&&i<=state.unlocked?"done":""].join(" ");
    return `<button class="${cls}" ${i>state.unlocked?"disabled":""} data-go="${i}"><span class="dot">${i<state.step&&i<=state.unlocked?"✓":i+1}</span>${n}</button>`;
  }).join("");
  $$("#stepper .step").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
}
function go(i){
  if(i>state.unlocked) return;
  state.step=i;
  $$(".screen").forEach(s=>s.classList.toggle("on", +s.dataset.screen===i));
  renderStepper();
  RENDER[i]();
  window.scrollTo({top:0, behavior:"smooth"});
}
function unlockAndGo(i){ state.unlocked=Math.max(state.unlocked,i); go(i); }

  const items = $$("#scanList li");

    if(i>0){
      const prev=items[i-1];
      prev.querySelector(".spinner").style.visibility="hidden";
      prev.querySelector(".st").textContent = p.cats[i-1].findings.length+" checks done";

    if(i>=items.length){

    i++;
    setTimeout(nextItem, 340+Math.random()*240);
  }
  setTimeout(nextItem, 400);
}

function sparkSVG(sp){
  const w=110, h=26, min=Math.min(...sp.data), max=Math.max(...sp.data);
  const pts = sp.data.map((v,i)=>[(i/(sp.data.length-1))*(w-6)+3, h-3-((v-min)/(max-min||1))*(h-8)]);
  const path = pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  return `<svg class="spark" width="${w}" height="${h}" role="img" aria-label="${esc(sp.label)}">
    <path d="${path}" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="var(--crit)" stroke="var(--surface)" stroke-width="2"/>
  </svg>`;
}

      </div>
      <div class="score-sum">
        <h3>Portal health: <span class="band ${b}" style="font-size:13px; vertical-align:2px;">${SEV_ICON[b==="warn"?"warn":b==="good"?"pass":"serious"]} ${BAND_LABEL[b]}</span></h3>
        <p>${p.company} scores <b>${ov}/100</b> across 8 areas and ${n.crit+n.serious+n.warn+n.pass} checks:
        <b>${n.crit} critical</b> finding${n.crit===1?"":"s"} actively costing revenue, ${n.serious} serious ones degrading trust in the data —
        and ${n.pass} things genuinely working well, because a credible audit finds strengths too.</p>
        <div class="sev-chips find-toolbar" id="sevChips" style="margin-bottom:0; margin-top:14px;">
          ${chips.map(([k,l,dot])=>`<button class="sev-chip ${state.filter===k?"on":""}" data-f="${k}">${dot?`<span class="sev-dot ${dot}"></span>`:""}${l}</button>`).join("")}
        </div>
      </div>
      <div class="hero-stats">
        <div class="hstat"><div class="v">${p.atRisk}</div><div class="l">Revenue at risk*</div></div>
        <div class="hstat"><div class="v">${quickWins}</div><div class="l">Quick wins, week one</div></div>
        <div class="hstat"><div class="v">30 days</div><div class="l">To a fixed portal</div></div>
      </div>
    </div>
    <p class="hero-foot">*Illustrative, based on ${p.atRiskBasis}.</p>
    <div class="find-toolbar">
      <div class="cat-chips" style="margin-bottom:0;">
        ${p.cats.map(c=>`<button class="cat-chip" data-jump="${c.id}">${c.icon} ${c.name}</button>`).join("")}
      </div>
      <button class="expand-btn" id="expandAll">${anyOpen?"Collapse all":"Expand all findings"}</button>
    </div>
    <div class="cat-grid" id="catGrid">
      ${p.cats.map(c=>{
        const cb = band(c.score);
        const vis = c.findings.filter(f=>state.filter==="all"||f.sev===state.filter);
        if(!vis.length) return "";
        return `
        <div class="card cat-card" data-cat="${c.id}" id="cat-${c.id}">
          <div class="cat-head">
            <span class="cat-ic">${c.icon}</span>
            <div>
              <div class="cat-name">${c.name}</div>
              <div class="cat-count">${c.findings.length} checks · ${c.findings.filter(f=>f.sev!=="pass").length} findings</div>
            </div>
            <div class="cat-score">
              <div class="cs-row"><span class="cs-num">${c.score}</span><span class="band ${cb}">${BAND_LABEL[cb]}</span></div>
              <div class="meter m-${cb}"><div class="mfill ${cb}" style="width:${c.score}%"></div></div>
            </div>
          </div>
          <div class="find-list">
            ${vis.map(f=>{
              const key = c.id+"|"+f.title;
              return `
              <div class="find-row ${state.open[key]?"open":""}" data-key="${esc(key)}">
                <button class="find-btn">
                  <span class="sev-tag ${f.sev}">${SEV_ICON[f.sev]} ${SEV_LABEL[f.sev]}</span>
                  <span class="find-title">${esc(f.title)}${f.spark?sparkSVG(f.spark):""}</span>
                  <span class="find-stat">${esc(f.stat)}</span>
                  <span class="chev">›</span>
                </button>
                <div class="find-detail">
                  <div class="fd-block"><b>Why it matters</b>${esc(f.impact)}</div>
                  <div class="fd-block"><b>The fix</b>${esc(f.fix)}</div>
                </div>
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
    <div class="next-row">
      <button class="btn btn-ghost left" id="switchPortal">↺ Audit a different portal</button>
      <button class="btn btn-primary" id="toPlan">See the prioritized fix plan →</button>
    </div>`;
  requestAnimationFrame(()=>{
    const rf = $("#ringFill");
    rf.style.transition="stroke-dashoffset 1.1s ease";
    requestAnimationFrame(()=>{ rf.style.strokeDashoffset = C*(1-ov/100); });
  });
  $$("#sevChips .sev-chip").forEach(ch=>ch.addEventListener("click",()=>{ state.filter=ch.dataset.f; renderFindings(); }));
  $$(".cat-chip").forEach(ch=>ch.addEventListener("click",()=>{
    const el=$("#cat-"+ch.dataset.jump);
    if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
  }));
  $("#expandAll").addEventListener("click",()=>{
    const open = !Object.values(state.open).some(Boolean);
    state.open={};
    if(open) p.cats.forEach(c=>c.findings.forEach(f=>{ state.open[c.id+"|"+f.title]=true; }));
    renderFindings();
  });
  $$("#catGrid .find-btn").forEach(btn=>btn.addEventListener("click",()=>{
    const row = btn.parentElement, key = row.dataset.key;
    state.open[key]=!state.open[key];
    row.classList.toggle("open", state.open[key]);
  }));
  $("#toPlan").addEventListener("click",()=>unlockAndGo(3));
  $("#switchPortal").addEventListener("click",()=>{ resetAudit(); go(0); });
}

/* ---------------- Screen 3: Fix plan ---------------- */
const WEEK_LABELS = {1:"Quick wins", 2:"Cleanup", 3:"Structure", 4:"Strategic & review"};
function renderPlan(){
  const p = P();
  const n = counts(p);
  const problems = n.crit+n.serious+n.warn;
  const weeks = [1,2,3,4].map(w=>{
    const fx = p.fixes.map((f,i)=>({f,i})).filter(x=>x.f.week===w);
    if(!fx.length) return "";
    return `<div class="tl-row"><span class="tl-week">Week ${w}</span><span class="tl-body"><b>${WEEK_LABELS[w]}:</b> ${fx.map(x=>`${x.f.t.toLowerCase()} <span style="color:var(--muted);">(#${x.i+1})</span>`).join(" · ")}</span></div>`;
  }).join("");
  $("#screen3").innerHTML = `
    <p class="eyebrow">Step 4 of 5 · ${p.company}</p>
    <h2 class="screen-title">The fix plan — ranked, not just listed</h2>
    <p class="screen-sub">An audit that ends with ${problems} problems is a complaint, not a plan. This one ends with ${p.fixes.length} fixes ordered by impact against effort, sequenced into a 30-day roadmap.</p>
    <div class="plan-cols">
      <div class="card plan-card">
        <h3>Top ${p.fixes.length} fixes</h3>
        <p class="sub">Numbers match the dots on the matrix</p>
        <ol class="fix-list">
          ${p.fixes.map((f,i)=>`
            <li class="fix-item">
              <span class="fix-n">${i+1}</span>
              <span class="fix-body"><b>${esc(f.t)}</b><span>${esc(f.d)}</span></span>
              <span class="fix-tags">
                <span class="tag ${f.impact==="High"?"hi":""}">Impact: ${f.impact}</span>
                <span class="tag">Effort: ${f.effort}</span>
              </span>
            </li>`).join("")}
        </ol>
      </div>
      <div>
        <div class="card quad-card" id="quadCard">
          <h3>Impact vs effort</h3>
          <p class="sub">Top-left is where week one lives</p>
          <div class="quad" id="quad">
            <span class="quad-lab" style="top:0; left:0;">Quick wins</span>
            <span class="quad-lab" style="top:0; right:0;">Strategic projects</span>
            <span class="quad-lab" style="bottom:0; left:0;">Fill-ins</span>
            <span class="quad-lab" style="bottom:0; right:0;">Deprioritize</span>
            ${p.fixes.map((f,i)=>`<span class="quad-dot" data-i="${i}" style="left:${f.x}%; top:${f.y}%;">${i+1}</span>`).join("")}
            <div class="quad-tip" id="quadTip"></div>
          </div>
          <div class="quad-axis"><span>Low effort</span><span>High effort →</span></div>
        </div>
        <div class="card tl-card" style="margin-top:14px;">
          <h3>30-day roadmap</h3>
          <p class="sub">How the ranked list becomes a schedule</p>
          <div class="tl-grid">${weeks}</div>
        </div>
      </div>
    </div>
    <div class="next-row">
      <button class="btn btn-ghost left" data-go-back="2">← Back to findings</button>
      <button class="btn btn-primary" id="toGet">What you get in a real audit →</button>
    </div>`;
  const quad=$("#quad"), tip=$("#quadTip");
  $$(".quad-dot", quad).forEach(d=>{
    d.addEventListener("mousemove",e=>{
      const f=p.fixes[+d.dataset.i];
      tip.textContent = (+d.dataset.i+1)+". "+f.t;
      const r=quad.getBoundingClientRect();
      tip.style.display="block";
      tip.style.left=Math.max(4, Math.min(e.clientX-r.left+12, r.width-tip.offsetWidth-4))+"px";
      tip.style.top=Math.max(4, e.clientY-r.top-34)+"px";
    });
    d.addEventListener("mouseleave",()=>{ tip.style.display="none"; });
  });
  $("#toGet").addEventListener("click",()=>unlockAndGo(4));
  $$("#screen3 [data-go-back]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.goBack)));
}

/* ---------------- Screen 4: Your audit ---------------- */

    <h2 class="screen-title">What your audit includes</h2>
    <p class="screen-sub">Same process you just clicked through — run on your real portal, with your real numbers, in five business days.</p>
    <div class="card process">
      <h3>How it runs</h3>

    </div>
    <div class="next-row">
      <button class="btn btn-ghost left" data-go-back="3">← Back to fix plan</button>

  $$("#faqSec .faq-q").forEach(q=>q.addEventListener("click",()=>{
    q.parentElement.classList.toggle("open");
  }));
  $("#dlReport").addEventListener("click", downloadReport);
  $("#switchPortal2").addEventListener("click",()=>{ resetAudit(); go(0); });
  $$("#screen4 [data-go-back]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.goBack)));
}
function downloadReport(){
  const p = P();
  const n = counts(p);
  const lines = [
    "HUBSPOT PORTAL AUDIT — SAMPLE REPORT (synthetic data)",
    "Portal: "+p.company+" · "+p.desc,
    "Date: "+new Date().toISOString().slice(0,10),
    "",
    "OVERALL HEALTH: "+overall(p)+"/100 — "+BAND_LABEL[band(overall(p))],
    "Findings: "+n.crit+" critical · "+n.serious+" serious · "+n.warn+" warning · "+n.pass+" passed",
    "Revenue at risk (illustrative): "+p.atRisk+" — "+p.atRiskBasis,
    ""
  ];
  p.cats.forEach(c=>{
    lines.push(c.name.toUpperCase()+" — "+c.score+"/100 ("+BAND_LABEL[band(c.score)]+")");
    c.findings.forEach(f=>{
      lines.push("  ["+SEV_LABEL[f.sev].toUpperCase()+"] "+f.title+" ("+f.stat+")");
      lines.push("      Why it matters: "+f.impact);
      lines.push("      The fix: "+f.fix);
    });
    lines.push("");
  });
  lines.push("TOP FIXES (impact vs effort, sequenced over 30 days)");
  p.fixes.forEach((f,i)=>lines.push("  "+(i+1)+". [Week "+f.week+"] "+f.t+" — Impact "+f.impact+", Effort "+f.effort));
  lines.push("");
  lines.push("Prepared by "+CONFIG.name+" — "+CONFIG.title);
  lines.push(CONFIG.email);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/plain"}));
  a.download="sample-hubspot-audit-"+p.id+".txt";
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ---------------- Guided tour ---------------- */
const TOUR = [
  {screen:0, sel:"#portalGrid", title:"Three portals, three stories", body:"A mid-market drifter, a fast-growing agency, and an enterprise sprawl — each with its own complete audit. Click any of them after the tour."},
  {screen:0, sel:"#coverGrid",  title:"Eight areas, 30+ checks", body:"Not a vibes-based review — a fixed checklist across data, pipeline, automation, email, adoption, reporting, integrations and governance. Same list for every portal."},
  {screen:2, sel:"#scoreHero",  title:"One honest number", body:"A health score, severity counts, revenue at risk, and how many quick wins are sitting in week one. Filter findings by severity — including what's already working.", prep:()=>{ if(!state.portalId) state.portalId="acme"; state.scanned=true; }},
  {screen:2, sel:"#catGrid",    title:"Impact and fix, always", body:"Every finding answers two questions: why does this cost you money, and what exactly fixes it. Click any row to expand — or expand all at once."},
  {screen:3, sel:"#quadCard",   title:"Ranked, not just listed", body:"Findings become a fix list plotted by impact against effort — week one starts in the quick-wins corner."},
  {screen:3, sel:".tl-card",    title:"A 30-day roadmap", body:"The ranked list becomes a schedule you could hand to any competent admin — or have me execute."},
  {screen:4, sel:"#priceSec",   title:"Fixed pricing, no surprises", body:"Priced by portal size, delivered in five business days — and the fee credits in full toward implementation."},
  {screen:4, sel:"#getGrid",    title:"The deliverables", body:"A scored report, a roadmap, a Loom walkthrough, a review call, and an async Q&A window. This demo is the report format — imagine it with your numbers."}
];
let tourIdx=-1, tourMask=null, tourCard=null;
function startTour(){
  if(!state.portalId) state.portalId="acme";
  state.scanned=true;
  tourIdx=0; state.unlocked=4; showTourStep();
}
function endTour(){
  tourIdx=-1;
  if(tourMask){tourMask.remove(); tourMask=null;}
  if(tourCard){tourCard.remove(); tourCard=null;}
}
function showTourStep(){
  const st=TOUR[tourIdx];
  if(!st){ endTour(); return; }
  if(st.prep) st.prep();
  go(st.screen);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const el=$(st.sel);
    if(!el){ endTour(); return; }
    el.scrollIntoView({block:"center", behavior:"instant"});
    const r=el.getBoundingClientRect();
    if(!tourMask){ tourMask=document.createElement("div"); tourMask.className="tour-mask"; document.body.appendChild(tourMask); }
    if(!tourCard){ tourCard=document.createElement("div"); tourCard.className="tour-card"; document.body.appendChild(tourCard); }
    const pad=8;
    tourMask.style.left=(r.left-pad)+"px"; tourMask.style.top=(r.top-pad)+"px";
    tourMask.style.width=(r.width+pad*2)+"px"; tourMask.style.height=(r.height+pad*2)+"px";
    tourCard.innerHTML=`
      <div class="tc-step">Tour · ${tourIdx+1} of ${TOUR.length}</div>
      <h4>${st.title}</h4><p>${st.body}</p>
      <div class="tour-nav">
        <button class="btn btn-ghost" id="tPrev" ${tourIdx===0?"disabled":""}>← Back</button>
        <button class="btn btn-primary" id="tNext">${tourIdx===TOUR.length-1?"Finish":"Next →"}</button>
        <button class="tour-close" id="tClose">Exit tour</button>
      </div>`;
    const below = r.bottom+180 < window.innerHeight;
    tourCard.style.top = below ? Math.min(r.bottom+14, window.innerHeight-220)+"px" : Math.max(r.top-200, 12)+"px";
    tourCard.style.left = Math.max(12, Math.min(r.left, window.innerWidth-372))+"px";
    $("#tNext").addEventListener("click",()=>{ tourIdx++; showTourStep(); });
    $("#tPrev").addEventListener("click",()=>{ tourIdx--; showTourStep(); });
    $("#tClose").addEventListener("click",endTour);
  }));
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") endTour(); });

/* ---------------- Theme + boot ---------------- */
function toggleTheme(){
  const cur=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=cur;
  try{ localStorage.setItem("as-theme",cur); }catch(e){}
}
const RENDER=[renderPortal, renderScan, renderFindings, renderPlan, renderGet];
function boot(){
  $("#footInner").innerHTML=`
    <span class="sig">Prepared by ${esc(CONFIG.name)}</span>
    <span>· ${esc(CONFIG.title)}</span>
    <span class="right">Sample audit — all data is synthetic. Not affiliated with HubSpot, Inc.</span>`;
  $("#themeBtn").addEventListener("click",toggleTheme);
  $("#tourBtn").addEventListener("click",startTour);
  renderStepper();
  go(0);
}
boot();
</script>
