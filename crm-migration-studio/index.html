<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Migration Studio — Interactive Demo</title>
<script>
  // Set theme before first paint (saved preference, else OS preference)
  (function(){
    var t = null;
    try { t = localStorage.getItem('ms-theme'); } catch(e){}
    if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<style>
  :root{
    --bg:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ef;
    --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
    --line:#e1e0d9; --hairline:rgba(11,11,11,.10);
    --accent:#2a78d6; --accent-soft:#cde2fb; --accent-deep:#1c5cab; --on-accent:#ffffff;
    --good:#0ca30c; --good-text:#006300; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
    --good-bg:rgba(12,163,12,.10); --warn-bg:rgba(250,178,25,.14); --serious-bg:rgba(236,131,90,.13); --crit-bg:rgba(208,59,59,.10);
    --shadow:0 1px 2px rgba(11,11,11,.05), 0 4px 16px rgba(11,11,11,.06);
    --shadow-lg:0 4px 12px rgba(11,11,11,.10), 0 16px 48px rgba(11,11,11,.14);
    --radius:12px;
  }
  :root[data-theme="dark"]{
    --bg:#0d0d0d; --surface:#1a1a19; --surface-2:#232322;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --line:#2c2c2a; --hairline:rgba(255,255,255,.10);
    --accent:#3987e5; --accent-soft:#184f95; --accent-deep:#86b6ef; --on-accent:#ffffff;
    --good:#0ca30c; --good-text:#0ca30c;
    --good-bg:rgba(12,163,12,.16); --warn-bg:rgba(250,178,25,.16); --serious-bg:rgba(236,131,90,.16); --crit-bg:rgba(208,59,59,.18);
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.35);
    --shadow-lg:0 4px 12px rgba(0,0,0,.5), 0 16px 48px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:system-ui, -apple-system, "Segoe UI", sans-serif;
    background:var(--bg); color:var(--ink);
    font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit; color:inherit; background:none; border:none; cursor:pointer;}
  select{font:inherit;}
  h1,h2,h3,h4{line-height:1.25; font-weight:650;}
  .wrap{max-width:1080px; margin:0 auto; padding:0 20px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--bg) 85%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-inner{display:flex; align-items:center; gap:12px; padding:12px 0;}
  .brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px;}
  .brand-mark{
    width:30px; height:30px; border-radius:8px; flex:none;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    display:grid; place-items:center; color:#fff;
  }
  .brand-mark svg{width:16px; height:16px;}
  .demo-chip{
    font-size:11px; font-weight:600; letter-spacing:.03em; text-transform:uppercase;
    color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, transparent);
    border:1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    padding:2px 8px; border-radius:99px;
  }
  .topbar-actions{margin-left:auto; display:flex; gap:8px; align-items:center;}
  .btn{
    display:inline-flex; align-items:center; gap:7px; justify-content:center;
    padding:9px 16px; border-radius:9px; font-weight:600; font-size:14px;
    border:1px solid transparent; transition:background .15s, border-color .15s, transform .06s;
    text-decoration:none;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--accent); color:var(--on-accent);}
  .btn-primary:hover{background:var(--accent-deep); color:var(--on-accent);}
  :root[data-theme="dark"] .btn-primary:hover{background:#5598e7;}
  .btn-ghost{border-color:var(--hairline); background:var(--surface); color:var(--ink);}
  .btn-ghost:hover{background:var(--surface-2);}
  .btn-lg{padding:12px 24px; font-size:15px; border-radius:11px;}
  .btn[disabled]{opacity:.45; cursor:not-allowed; pointer-events:none;}
  .icon-btn{width:38px; height:38px; padding:0; border-radius:9px; border:1px solid var(--hairline); background:var(--surface); display:grid; place-items:center;}
  .icon-btn:hover{background:var(--surface-2);}
  .icon-btn svg{width:17px; height:17px; stroke:var(--ink-2);}

  /* ---------- Stepper ---------- */
  .stepper{display:flex; gap:4px; padding:14px 0 0; overflow-x:auto; scrollbar-width:none;}
  .stepper::-webkit-scrollbar{display:none;}
  .step{
    display:flex; align-items:center; gap:8px; flex:1; min-width:max-content;
    padding:8px 12px; border-radius:9px; font-size:13px; font-weight:600; color:var(--muted);
    border:1px solid transparent; white-space:nowrap;
  }
  .step:not([disabled]):hover{background:var(--surface-2);}
  .step .dot{
    width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center;
    font-size:11px; font-weight:700; background:var(--surface-2); color:var(--muted);
    border:1px solid var(--line);
  }
  .step.done .dot{background:var(--good-bg); color:var(--good-text); border-color:transparent;}
  .step.done{color:var(--ink-2);}
  .step.active{color:var(--ink); background:var(--surface); border-color:var(--hairline); box-shadow:var(--shadow);}
  .step.active .dot{background:var(--accent); color:var(--on-accent); border-color:transparent;}
  .step[disabled]{cursor:not-allowed; opacity:.55;}

  /* ---------- Screens ---------- */
  main{padding:28px 0 60px;}
  .screen{display:none; animation:fadein .25s ease;}
  .screen.on{display:block;}
  @keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  .eyebrow{font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
  .screen-title{font-size:26px; margin-bottom:6px;}
  .screen-sub{color:var(--ink-2); max-width:640px; margin-bottom:26px;}

  .card{
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius);
    padding:20px;
  }
  .hairline-top{border-top:1px solid var(--line); margin-top:16px; padding-top:16px;}

  /* ---------- Overview ---------- */
  .hero{padding:36px 0 8px; text-align:center;}
  .hero h1{font-size:clamp(28px, 4.5vw, 40px); letter-spacing:-.01em; max-width:680px; margin:0 auto 14px;}
  .hero p{color:var(--ink-2); max-width:600px; margin:0 auto 10px; font-size:16px;}
  .hero .fineprint{font-size:13px; color:var(--muted);}
  .picker-label{font-size:13px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); margin:30px 0 12px;}
  .crm-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(180px, 1fr)); gap:12px;}
  .crm-card{
    display:flex; align-items:center; gap:12px; text-align:left;
    background:var(--surface); border:1px solid var(--hairline); border-radius:var(--radius);
    padding:14px 16px; transition:border-color .15s, box-shadow .15s;
  }
  .crm-card:hover{box-shadow:var(--shadow);}
  .crm-card.sel{border-color:var(--accent); box-shadow:0 0 0 1px var(--accent);}
  .crm-card[disabled]{opacity:.4; cursor:not-allowed;}
  .crm-logo{
    width:38px; height:38px; border-radius:10px; flex:none;
    display:grid; place-items:center; font-weight:800; font-size:15px; color:#fff;
  }
  .crm-name{font-weight:650; font-size:14px;}
  .crm-kind{font-size:12px; color:var(--muted);}
  .arrow-row{display:flex; justify-content:center; margin:6px 0; color:var(--muted);}
  .dataset-note{
    display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:center; align-items:center;
    margin:28px auto 20px; padding:12px 18px; border-radius:99px; width:max-content; max-width:100%;
    background:var(--surface); border:1px solid var(--hairline); font-size:13px; color:var(--ink-2);
  }
  .dataset-note b{color:var(--ink); font-weight:650;}
  .start-row{text-align:center; margin-top:8px;}
  .start-hint{font-size:13px; color:var(--muted); margin-top:10px;}

  /* ---------- Connect ---------- */
  .connect-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:760px){.connect-grid{grid-template-columns:1fr;}}
  .conn-head{display:flex; align-items:center; gap:12px; margin-bottom:4px;}
  .conn-role{font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted);}
  .conn-crm{font-weight:700; font-size:16px;}
  .scope-list{list-style:none; margin:14px 0; display:grid; gap:7px;}
  .scope-list li{display:flex; gap:9px; align-items:baseline; font-size:13.5px; color:var(--ink-2);}
  .scope-list .tick{color:var(--muted); flex:none; font-size:12px;}
  .conn-status{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; min-height:22px;}
  .conn-status.ok{color:var(--good-text);}
  .spinner{
    width:14px; height:14px; border-radius:50%; flex:none;
    border:2px solid var(--line); border-top-color:var(--accent);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
  .preflight{margin-top:16px;}
  .preflight h3{font-size:14px; margin-bottom:10px;}
  .pf-list{list-style:none; display:grid; gap:8px;}
  .pf-list li{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--ink-2); opacity:.35; transition:opacity .3s;}
  .pf-list li.on{opacity:1;}
  .pf-ic{width:18px; height:18px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:10px; font-weight:800;}
  .pf-ic.good{background:var(--good-bg); color:var(--good-text);}
  .pf-ic.info{background:color-mix(in srgb, var(--accent) 14%, transparent); color:var(--accent);}
  .next-row{display:flex; justify-content:flex-end; gap:10px; margin-top:24px;}
  .next-row .left{margin-right:auto;}

  /* ---------- Mapping ---------- */
  .map-toolbar{display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .tabs{display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px;}
  .tab{padding:7px 14px; border-radius:7px; font-size:13.5px; font-weight:600; color:var(--ink-2);}
  .tab.on{background:var(--surface); color:var(--ink); box-shadow:var(--shadow);}
  .coverage{margin-left:auto; min-width:220px; flex:1; max-width:320px;}
  .coverage .cov-label{display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-2); margin-bottom:5px;}
  .cov-track{height:8px; border-radius:99px; background:var(--accent-soft); overflow:hidden;}
  .cov-fill{height:100%; border-radius:99px; background:var(--accent); transition:width .3s ease;}
  .map-table-wrap{overflow-x:auto; border:1px solid var(--hairline); border-radius:var(--radius); background:var(--surface);}
  table.map{width:100%; border-collapse:collapse; min-width:680px;}
  table.map th{
    text-align:left; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--line); background:var(--surface);
  }
  table.map td{padding:10px 14px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle;}
  table.map tr:last-child td{border-bottom:none;}
  table.map tr:hover td{background:var(--surface-2);}
  .fld{font-weight:600;}
  .fld small{display:block; color:var(--muted); font-weight:500; font-size:11.5px;}
  .api-chip{
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:11px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:5px; padding:1px 6px; color:var(--ink-2);
  }
  .map-arrow{color:var(--muted); text-align:center; width:30px;}
  .map-select{
    width:100%; min-width:170px; padding:7px 9px; border-radius:8px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:13px;
  }
  .badge{
    display:inline-flex; align-items:center; gap:5px; white-space:nowrap;
    font-size:11.5px; font-weight:650; padding:3px 9px; border-radius:99px;
  }
  .badge.auto{background:var(--good-bg); color:var(--good-text);}
  .badge.custom{background:color-mix(in srgb, var(--accent) 12%, transparent); color:var(--accent);}
  .badge.review{background:var(--warn-bg); color:var(--ink);}
  .badge.transform{background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);}
  .badge.skip{background:var(--surface-2); color:var(--muted);}
  .stage-card{margin-top:16px;}
  .stage-card h3{font-size:15px; margin-bottom:4px;}
  .stage-card p{font-size:13px; color:var(--ink-2); margin-bottom:14px;}
  .stage-grid{display:grid; gap:8px;}
  .stage-row{display:grid; grid-template-columns:1fr 30px 1fr; align-items:center; gap:8px;}
  .stage-src{
    font-size:13px; font-weight:600; padding:8px 12px; border-radius:8px;
    background:var(--surface-2); border:1px solid var(--line);
  }
  .map-note{font-size:12.5px; color:var(--muted); margin-top:12px; display:flex; gap:7px; align-items:baseline;}

  /* ---------- Data quality ---------- */
  .dq-launch{text-align:center; padding:40px 20px;}
  .dq-launch p{color:var(--ink-2); max-width:520px; margin:0 auto 20px;}
  .scanline{
    height:8px; border-radius:99px; background:var(--accent-soft); overflow:hidden; max-width:420px; margin:0 auto 12px;
  }
  .scanline .cov-fill{transition:width .1s linear;}
  .scan-status{font-size:13px; color:var(--ink-2); min-height:20px;}
  .issue-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px; margin-bottom:18px;}
  .issue-card{opacity:0; transform:translateY(8px); transition:opacity .35s, transform .35s;}
  .issue-card.on{opacity:1; transform:none;}
  .issue-top{display:flex; align-items:flex-start; gap:11px; margin-bottom:10px;}
  .sev{
    width:34px; height:34px; border-radius:9px; flex:none; display:grid; place-items:center; font-size:15px;
  }
  .sev.warn{background:var(--warn-bg);}
  .sev.serious{background:var(--serious-bg);}
  .sev.info{background:color-mix(in srgb, var(--accent) 12%, transparent);}
  .issue-title{font-weight:650; font-size:14.5px;}
  .issue-count{font-size:12.5px; color:var(--ink-2);}
  .issue-body{font-size:13px; color:var(--ink-2); margin-bottom:12px;}
  .issue-body code{font-family:ui-monospace, Menlo, monospace; font-size:12px; background:var(--surface-2); padding:1px 5px; border-radius:4px;}
  .strategy{display:flex; align-items:center; gap:8px;}
  .strategy label{font-size:12px; font-weight:600; color:var(--muted); flex:none;}
  .dq-banner{
    display:flex; align-items:center; gap:10px; padding:13px 16px; border-radius:10px;
    background:var(--good-bg); color:var(--good-text); font-weight:600; font-size:14px; margin-bottom:18px;
  }
  .sample-wrap{overflow-x:auto; border:1px solid var(--hairline); border-radius:var(--radius); background:var(--surface);}
  table.sample{width:100%; border-collapse:collapse; min-width:720px; font-size:13px;}
  table.sample th{
    text-align:left; font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--muted); padding:10px 12px; border-bottom:1px solid var(--line);
  }
  table.sample td{padding:9px 12px; border-bottom:1px solid var(--line); color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums;}
  table.sample td.name{color:var(--ink); font-weight:600;}
  table.sample tr:last-child td{border-bottom:none;}
  .cell-flag{border-radius:6px; padding:1px 6px; font-size:11.5px; font-weight:650; white-space:nowrap;}
  .cell-flag.warn{background:var(--warn-bg); color:var(--ink);}
  .cell-flag.serious{background:var(--serious-bg); color:var(--ink);}
  .cell-flag.crit{background:var(--crit-bg); color:var(--crit);}
  :root[data-theme="dark"] .cell-flag.crit{color:#e66767;}
  .sample-caption{font-size:12.5px; color:var(--muted); padding:10px 14px; border-top:1px solid var(--line);}

  /* ---------- Run ---------- */
  .run-plan{margin-bottom:18px;}
  .run-plan h3{font-size:15px; margin-bottom:12px;}
  .plan-rows{display:grid; gap:6px; font-size:13.5px;}
  .plan-row{display:flex; justify-content:space-between; gap:12px; color:var(--ink-2);}
  .plan-row b{color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums;}
  .run-launch{text-align:center; padding:26px 20px 34px;}
  .run-launch p{color:var(--ink-2); max-width:520px; margin:0 auto 20px;}
  .obj-bars{display:grid; gap:14px; margin-bottom:20px;}
  .obj-bar .ob-label{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px;}
  .obj-bar .ob-name{font-weight:600;}
  .obj-bar .ob-count{color:var(--ink-2); font-variant-numeric:tabular-nums;}
  .ob-track{height:10px; border-radius:99px; background:var(--accent-soft); overflow:hidden;}
  .ob-fill{height:100%; border-radius:99px; background:var(--accent); width:0%; transition:width .12s linear;}
  .ob-fill.done{background:var(--good);}
  .console{
    background:#101312; color:#c8e6c9; border-radius:var(--radius); border:1px solid var(--hairline);
    font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; line-height:1.7;
    padding:14px 16px; height:210px; overflow-y:auto;
  }
  :root[data-theme="dark"] .console{background:#111413;}
  .console .t{color:#7d907e; margin-right:8px;}
  .console .ok{color:#7ee787;}
  .console .warn-l{color:#f2cc60;}
  .run-meta{display:flex; gap:18px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin-top:10px;}
  .run-meta b{color:var(--ink-2); font-weight:600; font-variant-numeric:tabular-nums;}

  /* ---------- Report ---------- */
  .tile-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:14px; margin-bottom:18px;}
  .tile{padding:16px 18px;}
  .tile .t-label{font-size:12.5px; color:var(--ink-2); margin-bottom:6px;}
  .tile .t-value{font-size:28px; font-weight:650; letter-spacing:-.01em;}
  .tile .t-sub{font-size:12px; color:var(--muted); margin-top:4px;}
  .tile .t-delta{font-size:12.5px; font-weight:650; margin-top:4px;}
  .t-delta.up{color:var(--good-text);}
  .report-cols{display:grid; grid-template-columns:1.2fr 1fr; gap:14px; margin-bottom:18px;}
  @media(max-width:820px){.report-cols{grid-template-columns:1fr;}}
  .chart-card h3, .res-card h3{font-size:15px; margin-bottom:2px;}
  .chart-card .sub, .res-card .sub{font-size:12.5px; color:var(--muted); margin-bottom:16px;}
  .hbar-chart{display:grid; gap:12px; position:relative;}
  .hbar{display:grid; grid-template-columns:150px 1fr; align-items:center; gap:10px;}
  .hbar .hb-label{font-size:13px; color:var(--ink-2); text-align:right;}
  .hb-track{position:relative; height:22px; display:flex; align-items:center;}
  .hb-fill{
    height:16px; background:var(--accent); border-radius:0 4px 4px 0;
    min-width:3px; transition:width .6s ease; cursor:default;
  }
  .hb-fill:hover{background:var(--accent-deep);}
  .hb-val{font-size:12.5px; font-weight:600; color:var(--ink-2); margin-left:8px; font-variant-numeric:tabular-nums;}
  .chart-tip{
    position:absolute; pointer-events:none; z-index:5; display:none;
    background:var(--ink); color:var(--bg); font-size:12px; font-weight:600;
    padding:6px 10px; border-radius:7px; white-space:nowrap; box-shadow:var(--shadow-lg);
  }
  .res-list{list-style:none; display:grid; gap:10px;}
  .res-list li{display:flex; gap:10px; align-items:baseline; font-size:13.5px; color:var(--ink-2);}
  .res-list b{color:var(--ink); font-weight:600;}
  .res-ic{flex:none; width:18px; height:18px; border-radius:50%; display:grid; place-items:center; font-size:10px; font-weight:800; transform:translateY(3px);}
  .res-ic.good{background:var(--good-bg); color:var(--good-text);}
  .res-ic.flag{background:var(--warn-bg); color:var(--ink);}
  .next-steps{margin-bottom:18px;}
  .next-steps h3{font-size:15px; margin-bottom:10px;}
  .next-steps ul{list-style:none; display:grid; gap:9px;}
  .next-steps li{display:flex; gap:10px; align-items:baseline; font-size:13.5px; color:var(--ink-2);}
  .cta-card{
    display:flex; align-items:center; gap:20px; flex-wrap:wrap;
    background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--surface));
  }
  .cta-card .cta-text{flex:1; min-width:240px;}
  .cta-card h3{font-size:17px; margin-bottom:4px;}

    const dot = (i<state.step && i<=state.unlocked) ? "✓" : (i+1);
    return `<button class="${cls}" ${dis} data-go="${i}"><span class="dot">${dot}</span>${n}</button>`;

  $$("#stepper .step").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.go)));
}

function go(i){
  if(i>state.unlocked) return;
  state.step = i;

  RENDER[i]();

}

  state.unlocked = Math.max(state.unlocked, i);

/* ---------------- Screen 2: Mapping ---------------- */
function buildMappings(){
  if(Object.keys(state.mappings).length) return;
  ["contacts","companies","deals"].forEach(obj=>{
    const sf = SRC_FIELDS[obj][state.src], df = DEST_FIELDS[obj][state.dst];
    state.mappings[obj] = sf.map(f=>{
      if(TRANSFORMS[f.canon] && !df.some(d=>d.canon===f.canon))
        return {destIdx:null, status:"transform"};
      const di = df.findIndex(d=>d.canon===f.canon);
      if(di>=0) return {destIdx:di, status: df[di].createCustom ? "custom" : "auto"};
      if(f.custom) return {destIdx:null, status:"custom"};
      return {destIdx:null, status:"review"};
    });
  });
  // default stage mapping: by position, snapping Won/Lost by name
  const ss = STAGES[state.src], ds = STAGES[state.dst];
  state.stageMap = ss.map((s,i)=>{
    const low = s.toLowerCase();
    if(low.includes("won"))  return ds.findIndex(d=>d.toLowerCase().includes("won"));
    if(low.includes("lost")) return ds.findIndex(d=>d.toLowerCase().includes("lost"));
    return Math.min(i, ds.length-3);
  });
}

function coverage(){
  let total=0, handled=0;
  ["contacts","companies","deals"].forEach(obj=>{
    (state.mappings[obj]||[]).forEach(m=>{ total++; if(m.status!=="review") handled++; });
  });
  return {total, handled};
}

const STATUS_BADGE = {
  auto:      `<span class="badge auto">✓ Auto-matched</span>`,
  custom:    `<span class="badge custom">＋ Create custom field</span>`,
  review:    `<span class="badge review">⚠ Needs review</span>`,
  transform: `<span class="badge transform">⇄ Transform</span>`,
  skip:      `<span class="badge skip">— Skipped</span>`
};

function objLabel(obj, crm){
  if(obj==="contacts") return "Contacts";
  if(obj==="companies") return CRMS[crm].terms.company;
  return CRMS[crm].terms.deal;
}

let runTimer=null;
function startRun(){
  const objs = RUN_OBJECTS();
  $("#runPanel").outerHTML = `
    <div class="card" id="runPanel">
      <div class="obj-bars" id="objBars">
        ${objs.map(o=>`
          <div class="obj-bar" data-key="${o.key}">
            <div class="ob-label"><span class="ob-name">${o.name}</span><span class="ob-count"><span class="cur">0</span> / ${fmt(o.total)}</span></div>
            <div class="ob-track"><div class="ob-fill"></div></div>
          </div>`).join("")}
      </div>
      <div class="console" id="console" aria-live="polite"></div>
      <div class="run-meta">
        <span>Elapsed <b id="elapsed">0.0s</b></span>
        <span>Throughput <b id="thru">—</b></span>
        <span>API errors <b>0</b></span>
        <span style="margin-left:auto;"><button class="btn btn-ghost" id="skipAnim" style="padding:5px 12px; font-size:12.5px;">Skip animation</button></span>
      </div>
    </div>`;
  const t0 = performance.now();
  const totalDur = objs.reduce((a,o)=>a+o.dur,0);
  let logIdx = 0;
  const conEl = $("#console");
  function paint(elapsed){
    let acc=0;
    objs.forEach(o=>{
      const bar = $(`#objBars [data-key="${o.key}"]`);
      const local = Math.min(Math.max(elapsed-acc,0)/o.dur, 1);
      bar.querySelector(".ob-fill").style.width=(local*100)+"%";
      if(local>=1) bar.querySelector(".ob-fill").classList.add("done");
      bar.querySelector(".cur").textContent = fmt(Math.round(o.total*local));
      acc+=o.dur;
    });
    while(logIdx<LOG_LINES.length && LOG_LINES[logIdx][0]<=elapsed){
      const [t, cls, msg] = LOG_LINES[logIdx];
      const line = document.createElement("div");
      line.innerHTML = `<span class="t">${(t/1000).toFixed(1)}s</span><span class="${cls==="ok"?"ok":cls==="warn"?"warn-l":""}">${esc(msg)}</span>`;
      conEl.appendChild(line);
      conEl.scrollTop = conEl.scrollHeight;
      logIdx++;
    }
    $("#elapsed").textContent = (elapsed/1000).toFixed(1)+"s";
    $("#thru").textContent = elapsed>400 ? fmt(Math.round(7768*Math.min(elapsed/totalDur,1)/(elapsed/1000)))+" rec/s" : "—";
  }
  runTimer = setInterval(()=>{
    const elapsed = performance.now()-t0;
    paint(Math.min(elapsed, totalDur+800));
    if(elapsed>=totalDur+800){ clearInterval(runTimer); finishRun(); }
  }, 90);
  $("#skipAnim").addEventListener("click",()=>{
    clearInterval(runTimer);
    paint(totalDur+800);
    finishRun();
  });
}
function finishRun(){
  if(state.migrated) return;
  state.migrated=true;
  state.unlocked=Math.max(state.unlocked,5);
  const meta = $("#screen4 .run-meta");
  if(meta) meta.insertAdjacentHTML("afterend", `
    <div class="dq-banner" style="margin-top:16px;"><span>✓</span> Migration complete — 7,753 records verified in ${CRMS[state.dst||"hubspot"].name}.</div>
    <div class="next-row" style="margin-top:4px;">
      <button class="btn btn-primary btn-lg" id="toReport">See the migration report →</button>
    </div>`);
  const tb = $("#toReport");
  if(tb) tb.addEventListener("click",()=>go(5));
  renderStepper();
}
function renderRunDone(){
  $("#screen4").innerHTML = `
    <p class="eyebrow">Step 5 of 6</p>
    <h2 class="screen-title">The migration run</h2>
    <div class="dq-banner"><span>✓</span> Migration already completed in this session — 7,753 records verified.</div>

      <button class="btn btn-ghost left" data-go-back="3">← Back</button>

    </div>`;

  $$("#screen4 [data-go-back]").forEach(b=>b.addEventListener("click",()=>go(+b.dataset.goBack)));
}

/* ---------------- Guided tour ---------------- */
const TOUR = [
  {screen:0, sel:"#srcGrid",   title:"Any source, any destination", body:"The same process works from Zoho, GoHighLevel, Pipedrive, Salesforce or a plain spreadsheet — into HubSpot, GoHighLevel or Zoho."},
  {screen:1, sel:"#connGrid",  title:"Secure, least-privilege access", body:"Real projects use OAuth you authorize yourself, with only the scopes the job needs — and a rollback snapshot before anything is written."},
  {screen:2, sel:"#covMeter",  title:"Every field accounted for", body:"The coverage meter won't let the migration proceed until every field is mapped, transformed, turned into a custom field, or consciously skipped."},
  {screen:2, sel:"#mapTable",  title:"Auto-match plus human judgment", body:"Standard fields match automatically. The interesting ones — custom fields, read-only targets, split names — get explicit decisions you can see."},
  {screen:2, sel:"#stageCard", title:"Pipelines land intact", body:"Deal stages are mapped one-by-one, so your pipeline reporting works on day one — no deals dumped into a single column.", prep:()=>{state.mapTab="deals";}},
  {screen:3, sel:"#issueGrid", title:"Problems surface before the move", body:"The dry run finds duplicates, bad emails, missing owners and orphaned records — and you approve the fix strategy for each class.", prep:()=>{state.dryRun=true;}},
  {screen:4, sel:"#runPanel",  title:"A run you can trust", body:"Batched and rate-limited, with live progress, a full log, and verification of source vs destination counts at the end."},
  {screen:5, sel:"#reportGrid",title:"A report, not a shrug", body:"You end with numbers your team can verify: what moved, what was fixed, what was flagged — and a quality score that went up.", prep:()=>{state.migrated=true; state.unlocked=5;}}
];
let tourIdx = -1, tourMask=null, tourCard=null;

function startTour(){
  if(!state.src || !state.dst){ state.src="zoho"; state.dst="hubspot"; }
  state.connected={src:true,dst:true};
  buildMappings();
  state.unlocked=Math.max(state.unlocked,2);
  tourIdx=0; showTourStep();
}
function endTour(){
  tourIdx=-1;
  if(tourMask){tourMask.remove(); tourMask=null;}
  if(tourCard){tourCard.remove(); tourCard=null;}
}
function showTourStep(){
  const st = TOUR[tourIdx];
  if(!st){ endTour(); return; }
  if(st.prep) st.prep();
  state.unlocked=Math.max(state.unlocked, st.screen);
  go(st.screen);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const el = $(st.sel);
    if(!el){ endTour(); return; }
    el.scrollIntoView({block:"center", behavior:"instant"});
    const r = el.getBoundingClientRect();
    if(!tourMask){ tourMask=document.createElement("div"); tourMask.className="tour-mask"; document.body.appendChild(tourMask); }
    if(!tourCard){ tourCard=document.createElement("div"); tourCard.className="tour-card"; document.body.appendChild(tourCard); }
    const pad=8;
    tourMask.style.left=(r.left-pad)+"px"; tourMask.style.top=(r.top-pad)+"px";
    tourMask.style.width=(r.width+pad*2)+"px"; tourMask.style.height=(r.height+pad*2)+"px";
    tourCard.innerHTML = `
      <div class="tc-step">Tour · ${tourIdx+1} of ${TOUR.length}</div>
      <h4>${st.title}</h4><p>${st.body}</p>
      <div class="tour-nav">
        <button class="btn btn-ghost" id="tPrev" ${tourIdx===0?"disabled":""}>← Back</button>
        <button class="btn btn-primary" id="tNext">${tourIdx===TOUR.length-1?"Finish":"Next →"}</button>
        <button class="tour-close" id="tClose">Exit tour</button>
      </div>`;
    const below = r.bottom+180 < window.innerHeight;
    tourCard.style.top = below ? Math.min(r.bottom+14, window.innerHeight-220)+"px" : Math.max(r.top-200, 12)+"px";
    tourCard.style.left = Math.max(12, Math.min(r.left, window.innerWidth-372))+"px";
    $("#tNext").addEventListener("click",()=>{ tourIdx++; showTourStep(); });
    $("#tPrev").addEventListener("click",()=>{ tourIdx--; showTourStep(); });
    $("#tClose").addEventListener("click",endTour);
  }));
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape") endTour(); });

function toggleTheme(){
  const cur = document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=cur;
  try{ localStorage.setItem("ms-theme",cur); }catch(e){}
}

    <span class="right">Demo environment — all data is synthetic.</span>`;
  $("#themeBtn").addEventListener("click",toggleTheme);
  $("#tourBtn").addEventListener("click",startTour);
  renderStepper();
  go(0);
}
boot();
